schema_version: 1
registry_id: phase10r-external-shogi-data
as_of: "2026-08-21"
policy:
  data_root_env: OPENSHOGI_DATA_ROOT
  default_data_root: local/phase10r-data
  minimum_free_bytes: 161061273600
  max_single_download_bytes: 21474836480
  max_parallel_downloads: 1
  max_requests_per_second: 1.0
  raw_data_ignored: true
  normalized_data_ignored: true
  checkpoint_policy: >-
    Keep resumable .part objects and HTTP ETag/Last-Modified metadata until the
    final object is checksum-verified; never delete an incomplete object automatically.
sources:
  - source_id: aobazero
    publisher: AobaZero project / Aya
    official_page: https://github.com/kobanium/aobazero
    state: approved
    reason: Existing OpenShogiAI approval is limited to the exact 100 no-noise CSA objects.
    rights_scope: exact existing Phase 3 catalog only; live records and new revisions remain pending.
    artifact_ids: [aobazero-no-noise-exact100]
  - source_id: dlshogi-gct
    publisher: Tadao Yamaoka / dlshogi
    official_page: https://tadaoyamaoka.hatenablog.com/entry/2021/05/06/223701
    state: pending_permission
    reason: Public release article and file names were found, but no formal data reuse grant was found.
    rights_scope: inventory only until training and derived-weight permission are confirmed.
    artifact_ids: [gct-selfplay-hcpe3, gct-floodgate-hcpe3, gct-taya36-hcpe3, gct-model-taya36-hcpe3, gct-aobazero-hcpe, gct-mixed-hcpe, gct-unique-selfplay-hcpe3, gct-suisho-entering-king-hcpe]
  - source_id: nodchip
    publisher: nodchip dataset publisher
    official_page: https://huggingface.co/nodchip
    state: pending_permission
    reason: Dataset pages expose repository metadata, but data and derived-weight rights are not established by that metadata alone.
    rights_scope: no bulk download or training until a rights chain is recorded.
    artifact_ids: [nodchip-hao-depth9, nodchip-tanuki-2024-07-30, nodchip-suisho5-depth9, nodchip-suisho5-depth9-entering-king]
  - source_id: taya-yaneura
    publisher: たややん / YaneuraOu ecosystem
    official_page: https://tadaoyamaoka.hatenablog.com/entry/2021/05/06/223701
    state: pending_permission
    reason: Exact artifact names are known from the public release index, but permission scope is unresolved.
    rights_scope: do not train on 36SFEN, 5247, KIF, or PSV artifacts until permission is pinned.
    artifact_ids: [taya-36sfen, taya-5247, taya-kif, taya-psv]
  - source_id: qhapaq
    publisher: Qhapaq project
    official_page: https://qhapaq.hatenablog.com/entry/2021/11/23/220251
    state: pending_permission
    reason: The author requests disclosure when trained evaluation functions are used in tournaments or published; redistribution and derived-weight terms remain unresolved.
    rights_scope: audit and permission draft only; no training activation.
    artifact_ids: [qhapaq-qpd-train]
  - source_id: floodgate
    publisher: Computer Shogi Association / Floodgate operators
    official_page: https://www.computer-shogi.org/
    state: pending_permission
    reason: Public reachability is not treated as permission for third-party ML training or redistribution.
    rights_scope: exact filters and source rights must be approved before acquisition.
    artifact_ids: [floodgate-filtered-records, floodgate-public-evaluation-test]
  - source_id: dl-suisho15b
    publisher: penguinkumimanu / DL水匠15b data release
    official_page: https://huggingface.co/datasets/penguinkumimanu/Knowledge_distilled_dataset_by_DLSuisho15b
    state: pending_permission
    reason: README documents transformation lineage and quality caveats, not a complete reuse and redistribution grant.
    rights_scope: do not download the approximately 855 GB release or train on it.
    artifact_ids: [dl-suisho15b-knowledge-distilled]
  - source_id: wcsc
    publisher: Computer Shogi Association
    official_page: https://www.computer-shogi.org/kifu/kifu.html
    state: approved
    reason: Official archive page states that game-record use is free with program, date, event, or source attribution.
    rights_scope: raw game-record training is approved with the required attribution; derived weights and redistribution remain separately marked pending.
    artifact_ids: [wcsc01-kifu, wcsc02-kifu, wcsc03-kifu, wcsc04-kifu, wcsc05-kifu, wcsc06-kifu, wcsc07-kifu, wcsc08-kifu, wcsc09-kifu, wcsc10-kifu, wcsc11-kifu, wcsc12-kifu, wcsc13-kifu, wcsc14-kifu, wcsc15-kifu, wcsc16-kifu, wcsc17-kifu, wcsc18-kifu, wcsc19-kifu, wcsc20-kifu, wcsc21-kifu, wcsc22-kifu, wcsc23-kifu, wcsc24-kifu, wcsc25-kifu, wcsc26-kifu, wcsc27-kifu, wcsc28-kifu, wcsc29-kifu, wcsc31-kifu, wcsc32-kifu, wcsc33-kifu, wcsc34-kifu, wcsc35-kifu, wcsc36-kifu]
  - source_id: denryu
    publisher: 電竜戦 / Denryu-sen
    official_page: https://denryu-sen.jp/denryusen/dr_link/dr1_live.php
    state: approved
    reason: Hardware 3 official archive states that game-record use has no restrictions; other event families remain separately gated.
    rights_scope: only the exact hardware-3 archive is approved for raw-record training; production, TSEC, and designated-position archives are pending or holdout.
    artifact_ids: [denryu-dr5-hardware3, denryu-dr6-production, denryu-dr6-tsec, denryu-dr5-production, denryu-dr5-tsec, denryu-dr4-hardware2, denryu-dr4-production, denryu-dr4-tsec, denryu-dr3-hardware1, denryu-dr3-production]
  - source_id: lishogi
    publisher: Lishogi
    official_page: https://lishogi.org/api
    state: pending_permission
    reason: API rate limits and site terms were reviewed, but the terms grant Lishogi a license rather than a third-party ML redistribution grant.
    rights_scope: no unauthenticated export or training; use only after account and ML rights are authorized.
    artifact_ids: [lishogi-games-api]
  - source_id: bonanza
    publisher: Bonanza project / maintained source mirror
    official_page: https://github.com/ianfab/bonanza
    state: approved_local_only
    reason: Bonanza source and evaluation tables are retained as historical prior art only; no trained-table import is authorized.
    rights_scope: local inspection and independent implementation research; no training, production import, or redistribution of third-party tables.
    artifact_ids: [bonanza-fv-bin-prior-art]
