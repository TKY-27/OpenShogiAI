schema: open_shogi_phase10_dataset_mixture/v1
frozen_as_of: "2026-08-21"
audit_catalog: configs/data_sources_external.yaml
audit_manifest: artifacts/phase10a/audit-manifest.json
deny_by_default: true

roles:
  - policy_pretraining
  - value_wdl_pretraining
  - ranking_supervision
  - opening_start_position_pool
  - validation
  - external_holdout

global_rules:
  one_training_row_per_canonical_position: true
  attach_compatible_labels_as_masks: true
  average_cross_source_scores: false
  convert_unknown_scores_to_centipawns: false
  pending_license_weight: 0.0
  rejected_weight: 0.0
  per_game_epoch_cap_fraction: 0.02
  per_opening_prefix_epoch_cap_fraction: 0.05
  source_weight_renormalization: within_active_stage_only

derived_controls:
  - control_id: openshogiai-apery-v2-labels
    artifact_subset: artifacts/phase4/teacher/labels-v2/labels.jsonl bound by manifest.json
    provenance: OpenShogiAI-selected positions analyzed by the approved separate Apery v2.0.0 teacher
    roles: [ranking_supervision, validation]
    stage_weights:
      representation_policy: 0.0
      source_value: 0.0
      canonical_calibration: 1.0
      hard_position_finetune: 0.75
    maximum_contribution_fraction: 1.0
    runtime_score_contribution: false
    release_constraint: Teacher binaries, evaluation files, raw labels, and generated weights remain unpublished pending their own review.

sources:
  - artifact_id: aobazero-no-noise-exact100
    audit_status: approved
    curriculum_decision: accepted
    exact_artifact_subset: configs/data_source_objects/aobazero_no_noise.yaml exact 100-object catalog only
    roles: [value_wdl_pretraining, ranking_supervision, opening_start_position_pool, validation]
    prohibited_roles: [policy_pretraining, external_holdout]
    stage_weights:
      representation_policy: 1.0
      source_value: 1.0
      canonical_calibration: 1.0
      hard_position_finetune: 0.25
    maximum_contribution_fraction: 1.0
    deduplication_priority: 500
    target_constraints: Use only legally replayed positions, verified factual outcomes, and OpenShogiAI-teacher labels; ignore raw AobaZero v annotations because semantics and perspective are unknown.
    attribution_release_constraints: Public Domain evidence is pinned for this exact catalog; do not expand the catalog. Generated-weight distribution remains pending independent review.

  - artifact_id: aobazero-no-noise-w4745-sample
    audit_status: approved
