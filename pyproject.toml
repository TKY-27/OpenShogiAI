[project]
name = "open-shogi-training"
version = "0.0.0"
description = "Training and evaluation foundation for OpenShogiAI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
authors = [{ name = "OpenShogiAI contributors" }]
dependencies = [
    # PyTorch imports its NumPy bridge eagerly; pin the tested ABI/runtime explicitly.
    "numpy==2.5.1",
    "PyYAML>=6.0.3,<7",
    "torch==2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
pythonpath = ["training"]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
