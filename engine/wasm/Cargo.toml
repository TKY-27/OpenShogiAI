[package]
name = "open-shogi-wasm"
description = "WebAssembly-compatible adapter foundation for OpenShogiAI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["handcrafted"]
handcrafted = ["dep:serde", "dep:sha2", "open-shogi-core/handcrafted"]
pure-only = ["dep:serde", "open-shogi-core/pure-only"]

[dependencies]
open-shogi-core = { workspace = true, default-features = false }
serde = { version = "=1.0.229", features = ["derive"], optional = true }
serde_json = "=1.0.151"
sha2 = { version = "=0.10.9", optional = true }
wasm-bindgen = "=0.2.127"

[dev-dependencies]
sha2 = "=0.10.9"
flate2 = "=1.1.9"

[lints]
workspace = true
