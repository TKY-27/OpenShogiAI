[package]
name = "open-shogi-core"
description = "Independently implemented core foundation for OpenShogiAI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["handcrafted"]
handcrafted = []
pure-only = []

[dependencies]
flate2 = "=1.1.9"
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
web-time = "=1.1.0"

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[[example]]
name = "phase10t_probe"
required-features = ["handcrafted"]
